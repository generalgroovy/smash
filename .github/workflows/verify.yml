name: Verify fighter
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Parse runtime scripts
        run: |
          node --check combat.js
          node --check cpu.js
          node --check game.js
      - name: Combat, CPU and integration regressions
        run: node --test tests/*.test.cjs
      - run: npm install --no-save --package-lock=false playwright@1.56.1
      - run: npx playwright install --with-deps chromium
      - name: Practice route in a composed browser
        run: node tests/browser.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: fighter-practice-route
          path: test-results/
